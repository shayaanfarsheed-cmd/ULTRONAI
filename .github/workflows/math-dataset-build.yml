name: ULTRON Build and Audit Mathematics Dataset

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Fixed reproducibility seed
        required: true
        default: "20261119"
        type: string

permissions:
  contents: read

concurrency:
  group: ultron-math-dataset-build
  cancel-in-progress: false

jobs:
  build-audit-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      DATASET_SEED: ${{ inputs.seed }}
    steps:
      - name: Check out ULTRON
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build, verify and audit 110,000 examples
        run: |
          python scripts/build_math_dataset.py \
            --output-dir build/math-dataset \
            --seed "$DATASET_SEED" \
            --train-count 100000 \
            --validation-count 5000 \
            --test-count 5000

      - name: Upload versioned dataset and quality report
        uses: actions/upload-artifact@v5
        with:
          name: ultron-math-foundation-dataset-${{ github.run_id }}
          path: build/math-dataset/
          if-no-files-found: error
          retention-days: 30

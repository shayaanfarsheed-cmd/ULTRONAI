name: ULTRON Safe CPU Compute Diagnostic
run-name: ULTRON CPU diagnostic · ${{ github.event_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-cpu-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out ULTRON
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Measure runner CPU, memory, disk, Python and PyTorch
        run: python scripts/diagnose_cpu_runner.py --output build/compute-diagnostic.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v5
        with:
          name: ultron-cpu-diagnostic-${{ github.run_id }}
          path: build/compute-diagnostic.json
          if-no-files-found: error
          retention-days: 7

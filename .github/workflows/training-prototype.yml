name: ULTRON Training Prototype Validation

on:
  push:
    branches:
      - prototype/training-validation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-training-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-training-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out prototype
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration
        run: |
          python -m json.tool config.json > /dev/null
          python -m json.tool servers.json > /dev/null
          python train.py --preflight --model-summary

      - name: Run unit and recovery tests
        run: python -m unittest discover -s tests -v

      - name: Run bounded data, checkpoint and optimizer smoke tests
        run: python train.py --data-smoke-test --checkpoint-smoke-test --training-smoke-test

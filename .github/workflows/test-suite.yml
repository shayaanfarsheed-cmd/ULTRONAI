name: ULTRON Test Suite

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate static dashboard JavaScript
        run: |
          node --check dashboard/app.js
          node --check dashboard/config.js
          node --check dashboard/math-agent.js
          node --check dashboard/math-agent-ui.js
          node --check dashboard/training-control.js

      - name: Validate JSON configuration and notebook
        run: |
          python -m json.tool config.json > /dev/null
          python -m json.tool servers.json > /dev/null
          python -m json.tool train.ipynb > /dev/null

      - name: Check dashboard for backend secret values
        run: |
          if grep -R -E 'sb_secret_[A-Za-z0-9]{12,}' dashboard; then
            echo "A backend secret-like value was found in dashboard files."
            exit 1
          fi

      - name: Compile Python modules
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run model, data, checkpoint and training smoke tests
        run: |
          python train.py --preflight --model-summary --data-smoke-test --checkpoint-smoke-test --training-smoke-test

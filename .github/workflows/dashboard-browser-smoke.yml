name: ULTRON Dashboard Browser Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-dashboard-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: browser-smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.65.1
      - name: Install browser and system dependencies
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run dashboard browser smoke test
        env:
          ULTRON_BROWSER: ${{ matrix.browser }}
        run: python tests/dashboard_browser_smoke.py

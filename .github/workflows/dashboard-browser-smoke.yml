name: ULTRON Dashboard Browser Smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-dashboard-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned Playwright
        run: python -m pip install playwright==1.65.1
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run dashboard browser smoke test
        run: python tests/dashboard_browser_smoke.py

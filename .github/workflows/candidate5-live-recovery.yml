name: ULTRON Candidate 5 Live Interrupted Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-candidate5-live-recovery
  cancel-in-progress: false

jobs:
  candidate5-live-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://euhmejpaswmdpsutbtse.supabase.co' }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
    steps:
      - name: Check out ULTRON
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate Candidate 5 live interrupted recovery
        run: python scripts/verify_candidate5_supabase_recovery.py

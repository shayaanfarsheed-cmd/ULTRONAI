name: ULTRON CPU Benchmark
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Measured steps per configuration (1-20)"
        required: false
        default: "4"
        type: string
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run bounded CPU benchmark
        run: python scripts/benchmark_cpu.py --steps "${{ inputs.steps }}" --warmup 1

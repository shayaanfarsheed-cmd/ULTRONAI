name: ULTRON Server Switcher

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ultron-switcher
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out ULTRON
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install switcher dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Evaluate training state and perform an allowed switch
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_OWNER_ID: ${{ secrets.SUPABASE_OWNER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" || -z "$SUPABASE_OWNER_ID" ]]; then
            echo "::notice::Switcher skipped safely: required Supabase repository configuration is not present."
            exit 0
          fi
          python ultron_switcher.py --config config.json --servers servers.json --repository-root .
